# On utilise une image qui contient déjà le JDK 17 et le SDK Android
image: mobiledevops/android-sdk-image:latest

variables:
  # Optimise Gradle pour les environnements CI (pas de daemon, moins de log)
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.project.android.interactive=false"

stages:
  - build

build-android:
  stage: build
  before_script:
    # On s'assure que le script gradlew est exécutable
    - chmod +x ./gradlew
  script:
    # On lance la compilation de l'APK de debug
    - ./gradlew assembleDebug
  artifacts:
    name: "TravelPath-Mobile-$CI_PIPELINE_IID"
    # Chemin vers l'APK généré (syntaxe standard Android)
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
    # Durée de conservation du fichier sur GitLab
    expire_in: 2 weeks
  rules:
    # On ne lance le build que sur la branche master
    - if: $CI_COMMIT_BRANCH == "master"
